name: Build addon

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Clone DragonMineZ (upstream main)
        run: git clone --depth 1 https://github.com/DragonMineZ/dragonminez.git dmz

      - name: Cache DMZ jar
        id: dmzcache
        uses: actions/cache@v4
        with:
          path: dmz-jar
          key: dmz-jar-v1

      - name: Build DragonMineZ
        if: steps.dmzcache.outputs.cache-hit != 'true'
        run: |
          cd dmz
          chmod +x gradlew
          ./gradlew build -x test --no-daemon 2>&1 | tee ../dmz-build.log
          test ${PIPESTATUS[0]} -eq 0
          cd ..
          mkdir -p dmz-jar
          JAR=$(ls dmz/build/libs/*.jar | grep -v -e sources -e javadoc | head -1)
          cp "$JAR" dmz-jar/dragonminez.jar

      - name: Prepare addon
        run: |
          if [ -f dmzgrowth-checkpoint10.zip ]; then unzip -q -o dmzgrowth-checkpoint10.zip; fi
          mkdir -p dmzgrowth/libs
          cp dmz-jar/dragonminez.jar dmzgrowth/libs/dragonminez-2.2.1.jar
          cp -r dmz/gradle dmzgrowth/gradle
          cp dmz/gradlew dmzgrowth/gradlew

      - name: Build addon
        run: |
          cd dmzgrowth
          chmod +x gradlew
          ./gradlew build --no-daemon 2>&1 | tee ../addon-build.log
          exit ${PIPESTATUS[0]}

      - name: Publish result to branch build-results
        if: always()
        run: |
          mkdir -p out
          if [ "${{ job.status }}" = "success" ]; then echo SUCCESS > out/status.txt; else echo FAILED > out/status.txt; fi
          echo "commit: $GITHUB_SHA" >> out/status.txt
          { grep -E "error:|warning: \\[|FAILED|Caused by|What went wrong|cannot find symbol|does not exist|Mixin" -A4 addon-build.log | head -300; } > out/errors.txt 2>/dev/null || true
          tail -n 200 addon-build.log > out/addon-tail.txt 2>/dev/null || true
          tail -n 80 dmz-build.log > out/dmz-tail.txt 2>/dev/null || true
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan build-results
          git rm -rf . > /dev/null 2>&1 || true
          cp out/*.txt .
          cp dmzgrowth/build/libs/*.jar . 2>/dev/null || true
          git add status.txt errors.txt addon-tail.txt dmz-tail.txt
          ls *.jar > /dev/null 2>&1 && git add *.jar || true
          git commit -m "build result $GITHUB_SHA"
          git push -f origin build-results

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dmzgrowth-jar
          path: dmzgrowth/build/libs/*.jar
